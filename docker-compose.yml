services:
  postgres:
    image: postgres:16-alpine
    container_name: cemedic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cemedic
      POSTGRES_USER: cemedic
      POSTGRES_PASSWORD: cemedic_dev
    ports:
      - "5432:5432"
    volumes:
      - cemedic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cemedic -d cemedic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cemedic_postgres_data: